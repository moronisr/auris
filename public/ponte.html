<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Auris</title></head>
<body style="font-family:system-ui;padding:24px;color:#101817">
<p id="s">Preparando o vídeo...</p>
<script>
(async () => {
  const s = document.getElementById('s');
  try {
    if (!window.opener) { s.textContent = 'Janela de origem não encontrada.'; return; }
    const arq = new URLSearchParams(location.search).get('f') === 'capa' ? '/auris-capa.jpg' : '/auris-demo.mp4';
    const blob = await (await fetch(arq, { cache: 'no-store' })).blob();
    window.opener.postMessage(blob, 'https://www.linkedin.com');
    s.textContent = 'Vídeo enviado. Pode fechar esta janela.';
    setTimeout(() => window.close(), 800);
  } catch (e) { s.textContent = 'Erro: ' + e.message; }
})();
</script>
</body></html>
